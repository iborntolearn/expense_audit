    entertainment spend across ALL their submissions in a rolling 365-day window,
    not just a single line (BR-TE-AU-04). A single entertainment charge can clear
    ENTERTAINMENT-CAP-01 every time and still represent an improper ongoing
    relationship with one recipient once aggregated over a year.
  type: cumulative_amount_cap
  applies_to:
    category: entertainment
  window_days: 365
  cap:
    EUR: 1800.0
    USD: 2000.0
    GBP: 1600.0
