# ---------------------------------------------------------------------------
# Country-specific regulatory compliance - [FORWARD-LOOKING] (BR-TE-AU-04,
# BR-TE-AU-09). Scoped to oe_code=CN/IN, which do not exist in
# config/generator.yaml's oe_codes (["DE","US","GB"]) - so these can never
# match a synthetic submission today, same treatment as the existing
# "airfare"/"rental_car" forward-looking categories. Genuine fapiao/GST/VAT
# field validation also needs extracted fields (fapiao number, GST/HSN code,
# VAT registration id) this build's extraction schema does not capture -
# these rules stand in for that using the closest existing rule types
# (receipt_required_above / tax_ratio_check) as an honest placeholder, not a
# real implementation of the country-specific field checks.
# ---------------------------------------------------------------------------
- id: FAPIAO-FIELD-CHECK-01
  description: '[FORWARD-LOOKING] China fapiao field validation placeholder - real
    implementation needs a dedicated fapiao-number extracted field, not yet in this
    build''s extraction schema. oe_code=CN does not exist in generator.yaml, so this
    can never fire against synthetic data today.'
  type: receipt_required_above
  applies_to:
    oe_code: CN
  threshold:
    CNY: 0.0
- id: GST-EINVOICE-CHECK-01
  description: '[FORWARD-LOOKING] India GST / e-invoice field validation placeholder
    - real implementation needs GSTIN/HSN extracted fields, not yet in this build''s
    extraction schema. oe_code=IN does not exist in generator.yaml, so this can never
    fire against synthetic data today.'
  type: receipt_required_above
  applies_to:
    oe_code: IN
  threshold:
    INR: 0.0
- id: VAT-RECOVERABILITY-EU-01
  description: '[FORWARD-LOOKING] EU VAT-recoverability flag placeholder - real
    implementation needs a VAT-registration-id extracted field and a recoverability
    determination, not a tax-ratio band. Uses tax_ratio_check as the closest existing
    mechanism; not a real VAT-recoverability check.'
  type: tax_ratio_check
  applies_to:
    oe_code: EU
  min_ratio: 0.0
  max_ratio: 0.27
- id: SUNSHINE-ACT-HCP-DISCLOSURE-01
  description: '[FORWARD-LOOKING] US Sunshine Act HCP (healthcare-professional)
    payment/transfer-of-value disclosure placeholder - real implementation needs a
    recipient-type ("HCP") extracted/entered field this build does not capture.
    GIFTS-GOVERNMENT-OFFICIAL-PROHIBITED-01 (prohibited_category) is the closest
    ACTIVE analogue today, for the distinct case of government-official gifts.'
  type: receipt_required_above
  applies_to:
    oe_code: US
    category: gifts
  threshold:
    USD: 0.0
