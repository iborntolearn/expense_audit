# Local operator accounts (Solution Design 10 - SSO/RBAC baseline-only in this
# build). Edit via System admin -> Users, not by hand-computing hashes here.
#
# Default seeded accounts - CHANGE THESE before sharing this app with anyone:
#   admin    / ChangeMe-Admin1!    (role: admin    - global super-admin, oe_code: null -
#                                   full access incl. Settings/System admin across every OE)
#   user     / ChangeMe-User1!     (role: user     - business pages only, scoped to oe_code: DE)
#   auditor  / ChangeMe-Auditor1!  (role: auditor  - read-only: Dashboard, Expense reports
#                                   with no approve/reject, Reports & exports incl. compliance
#                                   packs - BR-TE-AU-10 - scoped to oe_code: US)
#
# oe_code: null on a role=admin account makes it a GLOBAL admin (sees/manages
# every OE); an admin account WITH an oe_code is an "OE admin" scoped to just
# that one operating entity. user/auditor accounts always carry a real oe_code.
users:
